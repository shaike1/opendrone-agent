repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: bash -c 'cd backend && uv run --extra dev ruff check app tests'
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: bash -c 'cd backend && uv run --extra dev ruff format --check app tests'
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: mypy
        name: MyPy
        entry: bash -c 'cd backend && uv run --extra dev mypy app tests'
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: eslint
        name: ESLint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.[jt]sx?$

      - id: prettier
        name: Prettier
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
